
<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Anuwad - Hindi and Kannada translation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anuwad</title>
  <link rel="manifest" href="manifest.json">

  <script>
    window.anuwadSpeak = function (text, language) {
      return new Promise(function (resolve, reject) {
        if (!("speechSynthesis" in window)) {
          reject("Speech synthesis is not supported in this browser.");
          return;
        }

        window.speechSynthesis.cancel();

        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = language;
        utterance.rate = 0.85;

        utterance.onend = function () {
          resolve("complete");
        };

        utterance.onerror = function (event) {
          reject(event.error || "Speech playback failed.");
        };

        window.speechSynthesis.speak(utterance);
      });
    };

    window.anuwadStopSpeaking = function () {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
